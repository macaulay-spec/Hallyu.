name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json for build..."
            echo '{"project_info":{"project_number":"188074698582","project_id":"hallyu-76248","storage_bucket":"hallyu-76248.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:188074698582:android:b471d0fd0b89ba9d9898f7","android_client_info":{"package_name":"app.hallyu.android.rewrite"}},"oauth_client":[{"client_id":"188074698582-lt1969oqt9n4rk1jd1vhorcs110v3v2a.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyD5uREnyq1U2zP-ZER0T6IR9xJJsCZAMeg"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: Configure Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Print Keystore Certificate Fingerprints
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1|SHA256" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
